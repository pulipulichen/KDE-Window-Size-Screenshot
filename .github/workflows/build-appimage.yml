name: Build AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            prerelease=false
          else
            version="dev-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "asset=KDE-Window-Size-Screenshot-${version}-x86_64.AppImage" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 patchelf
          python -m pip install -r requirements.txt pyinstaller
      - name: Check capture regressions
        run: python -m unittest discover -s tests -v
      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool.AppImage
          VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/build_appimage.sh
      - name: Validate release assets
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          test -s "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          sha256sum --check "$ASSET.sha256"
      - name: Publish AppImage to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            ${{ steps.release.outputs.asset }}
            ${{ steps.release.outputs.asset }}.sha256
          body: |
            AppImage build for commit ${{ github.sha }}.
            Capture is enabled on X11 using existing display areas, xwd and ImageMagick, with target-window restoration. No isolated-display confirmation is required.
          generate_release_notes: true
