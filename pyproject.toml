[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kde-window-size-screenshot"
version = "0.1.0"
description = "A KDE utility for exact client-area screenshots"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
kde-window-size-screenshot = "kde_window_size_screenshot.__main__:main"

[tool.setuptools.packages.find]
include = ["kde_window_size_screenshot*"]
